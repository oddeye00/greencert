name: reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproducibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-smoke:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Install pinned dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verify native-command fail-fast behavior
        run: python scripts/test_reproducibility_fail_fast.py
      - name: Record environment
        run: python scripts/check_reproduction_environment.py
      - name: Run numerical smoke audit
        run: python reproduce.py smoke
      - name: Verify exact-integer norm audit and fixed fixtures
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python scripts/test_exact_dyadic_norm.py
          python scripts/extract_saved_norm_benchmark.py --extract output/norm_benchmark_ci
          python output/norm_benchmark_ci/scripts/benchmark_saved_dyadic_norms.py --manifest-sha256 5817bf337c156f7055e23108dc0d15e31935b0bff09a93e5d3899ac23baf2ea1 --report output/norm_benchmark_ci/replay.json
      - name: Verify read-only replay component contracts
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python scripts/extract_recorded_replay_sources.py --extract output/recorded_replay_ci
          python output/recorded_replay_ci/scripts/test_recorded_window_components.py
          python output/recorded_replay_ci/scripts/test_recorded_evidence_replay.py
      - name: Verify corrected continuation artifact
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          CUDA_VISIBLE_DEVICES: ''
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python scripts/summarize_public_repair_validation.py
          python scripts/audit_public_repair_statistics.py
          python scripts/test_public_repair_archive.py
          python scripts/test_public_repair_roundoff.py
          python scripts/read_public_repair_archive.py --extract output/repaired_continuation_ci
          python output/repaired_continuation_ci/scripts/test_public_repair_replay.py
          python output/repaired_continuation_ci/scripts/replay_public_repair.py --manifest-sha256 2ea5e687f173a7f7f0f6c31bdc9b435c628b8f74ca2172d771ef33a77c3109cd --mode ledger --report output/repaired_continuation_ci/ci_ledger.json
          python output/repaired_continuation_ci/scripts/replay_public_repair.py --manifest-sha256 2ea5e687f173a7f7f0f6c31bdc9b435c628b8f74ca2172d771ef33a77c3109cd --mode outputs --report output/repaired_continuation_ci/ci_outputs.json
          python output/repaired_continuation_ci/scripts/replay_public_repair.py --manifest-sha256 2ea5e687f173a7f7f0f6c31bdc9b435c628b8f74ca2172d771ef33a77c3109cd --mode neural --job 0 --job 40 --job 47 --report output/repaired_continuation_ci/ci_neural.json
      - name: Verify structured causal resolvent development
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python scripts/test_theorem_text_integrity.py
          python scripts/test_structured_parameter_green.py
          python scripts/test_structured_directional_two_response.py
          python scripts/test_causal_structured_resolvent.py
          python scripts/audit_causal_forward_radius.py
          python scripts/verify_transformer_segmented_resolvent_diagnostic.py
          python scripts/diagnose_transformer_low_rank_resolvent.py --help
          python scripts/regenerate_transformer_checkpoint.py --help
          python scripts/export_transformer_anchor_state.py --help
          python scripts/export_transformer_corrected_parameter_path.py --help
          python scripts/materialize_transformer_anchor_checkpoint.py --help
      - name: Regenerate Matplotlib figures twice
        run: python scripts/reproduce_figures.py --check-determinism
      - name: Audit public release boundaries
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python scripts/test_public_snapshot_scan.py
          python scripts/scan_public_snapshot.py --root .
          python scripts/audit_public_release.py --root .
