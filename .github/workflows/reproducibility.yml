name: reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproducibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-smoke:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Record environment
        run: python scripts/check_reproduction_environment.py
      - name: Run numerical smoke audit
        run: python reproduce.py smoke
      - name: Regenerate Matplotlib figures twice
        run: python scripts/reproduce_figures.py --check-determinism
      - name: Audit public release boundaries
        run: python scripts/audit_public_release.py --root .

